name: neural-avatar-test

x-avatar-build: &avatar-build
  context: .
  dockerfile: Dockerfile
  target: avatar

x-model-volumes: &model-volumes
  - ./checkpoints:/workspace/FasterLivePortrait/checkpoints
  - ./models:/workspace/models

services:
  model-init:
    build: *avatar-build
    image: neural-avatar:latest
    command: ["download"]
    volumes: *model-volumes
    restart: "no"

  # One service name and port for either local provider. TTS_PROVIDER selects
  # the matching isolated Docker target, image and entrypoint command.
  tts:
    build:
      context: .
      dockerfile: Dockerfile
      target: "${TTS_PROVIDER:-chatterbox}"
      args:
        BREEZE_INSTALL_FLASH_ATTN: "${BREEZE_INSTALL_FLASH_ATTN:-0}"
        FLASH_ATTN_CUDA_ARCHS: "${FLASH_ATTN_CUDA_ARCHS:-120}"
        CHATTERBOX_VERSION: "${CHATTERBOX_VERSION:-0.1.7}"
    image: "neural-avatar-tts-${TTS_PROVIDER:-chatterbox}:latest"
    command: ["${TTS_PROVIDER:-chatterbox}"]
    network_mode: host
    gpus: all
    shm_size: 4gb
    environment:
      TTS_PROVIDER: "${TTS_PROVIDER:-chatterbox}"
      # Set only through breeze-benchmark.sh unless intentionally testing a
      # known configuration. Empty means Breeze's eager baseline.
      # v2I default selected by the five-repeat v2H benchmark. Override with
      # an empty value for eager or another tested combination for rollback.
      BREEZE_FAST_ARGS: "${BREEZE_FAST_ARGS:---fast-depth-decoder --fast-codec --fast-backbone-decode}"
      CHATTERBOX_VARIANT: "${CHATTERBOX_VARIANT:-turbo}"
      CHATTERBOX_DEVICE: "${CHATTERBOX_DEVICE:-cuda}"
      CHATTERBOX_LANGUAGE: "${CHATTERBOX_LANGUAGE:-en}"
      CHATTERBOX_EXAGGERATION: "${CHATTERBOX_EXAGGERATION:-0.5}"
      CHATTERBOX_CFG_WEIGHT: "${CHATTERBOX_CFG_WEIGHT:-0.5}"
    volumes:
      - ./models:/workspace/models
      - ./models/chatterbox-cache:/root/.cache/huggingface
      - ./inputs:/workspace/inputs:ro
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$${TTS_PROVIDER}\" = chatterbox ]; then curl --fail --silent http://127.0.0.1:7860/health; else curl --fail --silent http://127.0.0.1:7860/docs; fi"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: "no"

  webrtc-avatar:
    build: *avatar-build
    image: neural-avatar:latest
    command: ["serve"]
    container_name: avatar_webrtc_studio
    network_mode: host
    gpus: all
    ipc: host
    shm_size: 8gb
    environment:
      TTS_PROVIDER: "${TTS_PROVIDER:-chatterbox}"
      TTS_URL: "${TTS_URL:-http://127.0.0.1:7860}"
      AVATAR_PATH: /workspace/inputs/avatar.jpg
      FLP_CONFIG_PATH: /workspace/FasterLivePortrait/configs/onnx_infer.yaml
      # The crop contains the animated face and avoids the per-frame cuSOLVER
      # matrix inverse used to composite it back into the original photograph.
      AVATAR_PASTE_BACK: "false"
      # v2B bypasses FLP's temporary pickle, two MP4 files, two FFmpeg muxes
      # and the final OpenCV decode. Set false for an immediate v2A.1 rollback.
      DIRECT_MEMORY_RENDER: "true"
      # v2K publishes each completed FLP frame window immediately instead of
      # waiting for the complete phrase frame loop. Set false for v2J behavior.
      INCREMENTAL_FRAME_WINDOWS: "${AVATAR_INCREMENTAL_FRAME_WINDOWS:-true}"
      # Eight rendered frames represent about 0.64 s at stride 2. Smaller
      # windows start sooner but provide less protection against GPU jitter.
      RENDER_WINDOW_FRAMES: "${AVATAR_RENDER_WINDOW_FRAMES:-8}"
      # v2C-A renders every second 25 FPS motion frame, then WebRTC holds each
      # rendered frame for the skipped interval. Set 1 for full v2B quality.
      RENDER_STRIDE: "${AVATAR_RENDER_STRIDE:-2}"
      # v2F keeps stride 2 for the first phrase / a healthy queue and switches
      # to stride 3 when less than 0.75 seconds remains buffered.
      ADAPTIVE_RENDER_STRIDE: "${AVATAR_ADAPTIVE_RENDER_STRIDE:-true}"
      CATCHUP_RENDER_STRIDE: "${AVATAR_CATCHUP_RENDER_STRIDE:-3}"
      CATCHUP_BUFFER_SECONDS: "${AVATAR_CATCHUP_BUFFER_SECONDS:-0.75}"
      # v2C-B testing showed that concurrent TTS approximately halved portrait
      # FPS on the shared laptop GPU. Keep serial scheduling for v2E.
      TTS_PREFETCH: "${AVATAR_TTS_PREFETCH:-false}"
      # Keep FasterLivePortrait's initial driving reference for every phrase
      # in one utterance. Set false for immediate v2H phrase-reset behavior.
      PERSISTENT_PHRASE_MOTION: "${AVATAR_PERSISTENT_PHRASE_MOTION:-true}"
      # Required for FasterLivePortrait to apply its stored first-frame motion
      # reference. Set false together with persistence for v2H behavior.
      AVATAR_RELATIVE_MOTION: "${AVATAR_RELATIVE_MOTION:-true}"
      # Voice modes exposed in the browser:
      #   design           = reference-free voice design with CFG 4
      #   preset-clone     = fixed reference identity with CFG 1
      #   preset-direction = fixed identity plus this direction with CFG 4
      TTS_DEFAULT_VOICE_MODE: "${TTS_DEFAULT_VOICE_MODE:-preset-clone}"
      BREEZE_VOICE_INSTRUCTION: "A warm, clear, natural voice with a calm conversational delivery."
      BREEZE_DESIGN_CFG_SCALE: "4"
      BREEZE_PRESET_CLONE_CFG_SCALE: "1"
      BREEZE_PRESET_DIRECTION_CFG_SCALE: "4"
      BREEZE_PRESET_CLONE_INSTRUCTION: "Speak naturally in the reference voice."
      # A generated Breeze sentence or an owned/licensed WAV can be the preset.
      # Preset modes become selectable only when both the WAV and its exact
      # transcript file exist in ./inputs.
      BREEZE_PRESET_AUDIO_PATH: "${AVATAR_PRESET_AUDIO_PATH:-/workspace/inputs/voice-preset.wav}"
      BREEZE_PRESET_TRANSCRIPT_FILE: "${AVATAR_PRESET_TRANSCRIPT_FILE:-/workspace/inputs/voice-preset.txt}"
      # Optional alternative to the .txt file; leave empty to read the file.
      BREEZE_PRESET_TRANSCRIPT: ""
      # v2A initializes Breeze, HuBERT, JoyVASA and the renderer before the
      # browser can submit its first request. Failure is reported but nonfatal.
      STARTUP_WARMUP: "true"
      WARMUP_TEXT: "Hello."
      # Show an already-rendered, aligned warm-up frame while idle. The source
      # photo remains hidden, avoiding the large pose/crop jump at first speech.
      USE_NEURAL_IDLE_FRAME: "${AVATAR_USE_NEURAL_IDLE_FRAME:-true}"
      # Frame zero normally has the neutral initial JoyVASA pose. This can be
      # changed for diagnosis without rebuilding the image.
      WARMUP_IDLE_FRAME_INDEX: "${AVATAR_WARMUP_IDLE_FRAME_INDEX:-0}"
      # Protect manual or partial Compose starts: wait for the TTS provider instead of
      # failing warm-up immediately when port 7860 is not ready yet.
      TTS_STARTUP_WAIT_SECONDS: "300"
      TTS_STARTUP_POLL_SECONDS: "2"
      # Progressive phrase playback: generate phrase 1, start playback, then
      # generate later phrases while the current media queue is consumed.
      PROGRESSIVE_PHRASE_MODE: "true"
      PHRASE_FIRST_TARGET_CHARS: "${AVATAR_PHRASE_FIRST_TARGET_CHARS:-48}"
      PHRASE_TARGET_CHARS: "${AVATAR_PHRASE_TARGET_CHARS:-100}"
      PHRASE_MAX_CHARS: "${AVATAR_PHRASE_MAX_CHARS:-160}"
      # For remote/NAT clients, set a TURN server JSON array here.
      ICE_SERVERS_JSON: "[]"
    volumes:
      - ./inputs:/workspace/inputs:ro
      - ./checkpoints:/workspace/FasterLivePortrait/checkpoints:ro
      - ./results:/workspace/results
    depends_on:
      model-init:
        condition: service_completed_successfully
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: "no"

  # Invoked by benchmark.sh only. It uses the avatar image for httpx and WAV
  # tooling, writes the fixed Breeze-generated preset into ./inputs, and exits.
  benchmark-fixture:
    profiles: ["benchmark"]
    build: *avatar-build
    image: neural-avatar:latest
    network_mode: host
    command:
      - python
      - /workspace/FasterLivePortrait/benchmark_avatar.py
      - prepare-preset
    volumes:
      - ./inputs:/workspace/inputs
      - ./results:/workspace/results
    depends_on:
      tts:
        condition: service_healthy
    restart: "no"
