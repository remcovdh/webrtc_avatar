name: neural-avatar-test

x-avatar-build: &avatar-build
  context: .
  dockerfile: Dockerfile
  target: avatar

x-model-volumes: &model-volumes
  - ./checkpoints:/workspace/FasterLivePortrait/checkpoints
  - ./models:/workspace/models

services:
  model-init:
    build: *avatar-build
    image: neural-avatar:latest
    command: ["download"]
    volumes: *model-volumes
    restart: "no"

  # One service name and port for either local provider. TTS_PROVIDER selects
  # the matching isolated Docker target, image and entrypoint command.
  tts:
    build:
      context: .
      dockerfile: Dockerfile
      target: "${TTS_PROVIDER:-chatterbox}"
      args:
        BREEZE_INSTALL_FLASH_ATTN: "${BREEZE_INSTALL_FLASH_ATTN:-0}"
        FLASH_ATTN_CUDA_ARCHS: "${FLASH_ATTN_CUDA_ARCHS:-120}"
        CHATTERBOX_VERSION: "${CHATTERBOX_VERSION:-0.1.7}"
    image: "neural-avatar-tts-${TTS_PROVIDER:-chatterbox}:latest"
    command: ["${TTS_PROVIDER:-chatterbox}"]
    network_mode: host
    gpus: all
    shm_size: 4gb
    environment:
      TTS_PROVIDER: "${TTS_PROVIDER:-chatterbox}"
      # Set only through breeze-benchmark.sh unless intentionally testing a
      # known configuration. Empty means Breeze's eager baseline.
      # v2I default selected by the five-repeat v2H benchmark. Override with
      # an empty value for eager or another tested combination for rollback.
      BREEZE_FAST_ARGS: "${BREEZE_FAST_ARGS:---fast-depth-decoder --fast-codec --fast-backbone-decode}"
      CHATTERBOX_VARIANT: "${CHATTERBOX_VARIANT:-turbo}"
      CHATTERBOX_DEVICE: "${CHATTERBOX_DEVICE:-cuda}"
      CHATTERBOX_LANGUAGE: "${CHATTERBOX_LANGUAGE:-en}"
      CHATTERBOX_EXAGGERATION: "${CHATTERBOX_EXAGGERATION:-0.5}"
      CHATTERBOX_CFG_WEIGHT: "${CHATTERBOX_CFG_WEIGHT:-0.5}"
    volumes:
      - ./models:/workspace/models
      - ./models/chatterbox-cache:/root/.cache/huggingface
      - ./inputs:/workspace/inputs:ro
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$${TTS_PROVIDER}\" = chatterbox ]; then curl --fail --silent http://127.0.0.1:7860/health; else curl --fail --silent http://127.0.0.1:7860/docs; fi"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: "no"

  # Listening worker (M1): VAD + Nemotron 3.5 streaming ASR + Nemotron-3-
  # Diarization. Its own image because it needs a newer Transformers build than
  # the avatar image; the avatar reaches it through a Unix socket.
  listener:
    build:
      context: .
      dockerfile: Dockerfile
      target: listener
    image: neural-avatar-listener:latest
    gpus: all
    environment:
      LISTENER_SOCKET: /run/avatar/listener.sock
      LISTENER_ASR_LOOKAHEAD: "${LISTENER_ASR_LOOKAHEAD:-3}"
      LISTENER_DIAR_MODE: "${LISTENER_DIAR_MODE:-very_low_latency}"
      LISTENER_MIN_SILENCE_MS: "${LISTENER_MIN_SILENCE_MS:-300}"
      # Opt-in: keep each utterance's audio next to the conversation log.
      LISTENER_SAVE_AUDIO: "${LISTENER_SAVE_AUDIO:-false}"
    volumes:
      - avatar-run:/run/avatar
      - ./models/hf-listener:/root/.cache/huggingface
      - ./results:/workspace/results
    restart: unless-stopped

  # Conductor (M2): turn-taking, replies and the local conversation log
  # (results/conversations/). Delete logs with forget.py (see its header).
  conductor:
    build:
      context: .
      dockerfile: Dockerfile
      target: conductor
    image: neural-avatar-conductor:latest
    environment:
      CONDUCTOR_SOCKET: /run/avatar/conductor.sock
      # Silence that ends the user's turn: ends in ?/./! / otherwise / after a
      # connective ("and", "maar", ...). LISTENER_MIN_SILENCE_MS is subtracted.
      TURN_END_PUNCTUATION_MS: "${TURN_END_PUNCTUATION_MS:-400}"
      TURN_SILENCE_MS: "${TURN_SILENCE_MS:-700}"
      TURN_CONNECTIVE_MS: "${TURN_CONNECTIVE_MS:-1200}"
      LISTENER_MIN_SILENCE_MS: "${LISTENER_MIN_SILENCE_MS:-300}"
      # M3: System 1 (Laya on the CPU, classes and reactions in
      # config/system1.json, corrections in results/system1/). "echo" = M2.
      CONDUCTOR_RESPONDER: "${CONDUCTOR_RESPONDER:-system1}"
      SYSTEM1_CONFIG: /workspace/config/system1.json
      SYSTEM1_MEMORY: /workspace/results/system1/corrections.jsonl
      SYSTEM1_DEVICE: "${SYSTEM1_DEVICE:-cpu}"
    volumes:
      - avatar-run:/run/avatar
      - ./results:/workspace/results
      # Folder mount (not the file) so editors that replace the file still
      # reach the running conductor, which re-reads it on change.
      - ./config:/workspace/config:ro
      - ./models/hf-conductor:/root/.cache/huggingface
    restart: unless-stopped

  webrtc-avatar:
    build: *avatar-build
    image: neural-avatar:latest
    command: ["serve"]
    container_name: avatar_webrtc_studio
    network_mode: host
    gpus: all
    ipc: host
    shm_size: 8gb
    environment:
      TTS_PROVIDER: "${TTS_PROVIDER:-chatterbox}"
      TTS_URL: "${TTS_URL:-http://127.0.0.1:7860}"
      AVATAR_PATH: /workspace/inputs/avatar.jpg
      FLP_CONFIG_PATH: /workspace/FasterLivePortrait/configs/onnx_infer.yaml
      # The crop contains the animated face and avoids the per-frame cuSOLVER
      # matrix inverse used to composite it back into the original photograph.
      AVATAR_PASTE_BACK: "false"
      # v2B bypasses FLP's temporary pickle, two MP4 files, two FFmpeg muxes
      # and the final OpenCV decode. Set false for an immediate v2A.1 rollback.
      DIRECT_MEMORY_RENDER: "true"
      # v2K publishes each completed FLP frame window immediately instead of
      # waiting for the complete phrase frame loop. Set false for v2J behavior.
      INCREMENTAL_FRAME_WINDOWS: "${AVATAR_INCREMENTAL_FRAME_WINDOWS:-true}"
      # Eight rendered frames represent about 0.64 s at stride 2. Smaller
      # windows start sooner but provide less protection against GPU jitter.
      RENDER_WINDOW_FRAMES: "${AVATAR_RENDER_WINDOW_FRAMES:-8}"
      # v2C-A renders every second 25 FPS motion frame, then WebRTC holds each
      # rendered frame for the skipped interval. Set 1 for full v2B quality.
      # v2Q: TensorRT renders 23-35 FPS, so stride 1 (all 25 motion FPS) is
      # the default; the catch-up stride 2 keeps motion smooth when it dips.
      RENDER_STRIDE: "${AVATAR_RENDER_STRIDE:-1}"
      # v2F keeps RENDER_STRIDE for the first phrase / a healthy queue and
      # switches to CATCHUP_RENDER_STRIDE when less than 0.75 s remains buffered.
      ADAPTIVE_RENDER_STRIDE: "${AVATAR_ADAPTIVE_RENDER_STRIDE:-true}"
      CATCHUP_RENDER_STRIDE: "${AVATAR_CATCHUP_RENDER_STRIDE:-2}"
      CATCHUP_BUFFER_SECONDS: "${AVATAR_CATCHUP_BUFFER_SECONDS:-0.75}"
      # FLP renders below real time here, so each phrase's speech waits until
      # duration * (1 - render speed) * safety seconds of video exist. The
      # mouth then stays in sync without skipping frames, at the cost of a
      # later start. Render speed starts at EXPECTED_RENDER_FPS and is then
      # measured. Set false for immediate starts with frame skipping.
      SPEECH_START_GATE: "${AVATAR_SPEECH_START_GATE:-true}"
      EXPECTED_RENDER_FPS: "${AVATAR_EXPECTED_RENDER_FPS:-9.0}"
      SPEECH_START_SAFETY: "${AVATAR_SPEECH_START_SAFETY:-1.15}"
      # v2M waits for the first video window and a minimum playable buffer
      # before allowing one future TTS phrase onto the shared laptop GPU.
      # Set false for serial v2L scheduling; policy=eager restores the old test.
      TTS_PREFETCH: "${AVATAR_TTS_PREFETCH:-true}"
      TTS_PREFETCH_POLICY: "${AVATAR_TTS_PREFETCH_POLICY:-adaptive}"
      TTS_PREFETCH_MIN_BUFFER_SECONDS: "${AVATAR_TTS_PREFETCH_MIN_BUFFER_SECONDS:-0.50}"
      # Keep FasterLivePortrait's initial driving reference for every phrase
      # in one utterance. Set false for immediate v2H phrase-reset behavior.
      PERSISTENT_PHRASE_MOTION: "${AVATAR_PERSISTENT_PHRASE_MOTION:-true}"
      # Required for FasterLivePortrait to apply its stored first-frame motion
      # reference. Set false together with persistence for v2H behavior.
      AVATAR_RELATIVE_MOTION: "${AVATAR_RELATIVE_MOTION:-true}"
      # Visual-quality controls. `lip` is useful for diagnosing unwanted eye
      # motion; `all` retains full facial/head animation.
      AVATAR_ANIMATION_REGION: "${AVATAR_ANIMATION_REGION:-all}"
      AVATAR_DRIVING_MULTIPLIER: "${AVATAR_DRIVING_MULTIPLIER:-1.0}"
      AVATAR_NORMALIZE_LIP: "${AVATAR_NORMALIZE_LIP:-true}"
      AVATAR_EYE_RETARGETING: "${AVATAR_EYE_RETARGETING:-false}"
      # Scale of JoyVASA's generated eye motion (gaze drift and blinks):
      # 1.0 = as generated, 0.0 = the portrait's own eyes. 0.3 removes the
      # staring and winking seen at 1.0 while keeping some eye life.
      AVATAR_EYE_MOTION_SCALE: "${AVATAR_EYE_MOTION_SCALE:-0.3}"
      # Scale of JoyVASA's head rotation/translation around the first pose.
      # At 1.0 the head drifted 1-5 degrees up and rolled, so the avatar
      # looked above the camera; 0.3 keeps small nods but a level gaze.
      AVATAR_HEAD_MOTION_SCALE: "${AVATAR_HEAD_MOTION_SCALE:-0.3}"
      # Shift the mouth against the voice: positive shows it later. JoyVASA's
      # mouth leads the loudness by ~40-160 ms; +80 felt right in the browser
      # and made the browser's audio/video buffers nearly equal (53/66 ms).
      AVATAR_LIP_SYNC_OFFSET_MS: "${AVATAR_LIP_SYNC_OFFSET_MS:-80}"
      # FLP rotated the source crop to straighten the face, which tilted the
      # whole frame and showed black wedges. false keeps the crop upright.
      AVATAR_CROP_ROTATION: "${AVATAR_CROP_ROTATION:-false}"
      # How JoyVASA's mouth reaches the portrait. `absolute` uses its mouth
      # shapes directly (eyes and head stay relative); `relative` applied its
      # change since the first frame, which pressed this portrait's lips shut.
      AVATAR_LIP_MOTION_MODE: "${AVATAR_LIP_MOTION_MODE:-absolute}"
      # Relative mode only: above 1.0 opens the mouth further.
      AVATAR_LIP_MOTION_SCALE: "${AVATAR_LIP_MOTION_SCALE:-1.0}"
      # Optional: save every phrase's WAV and JoyVASA motion for offline
      # analysis, e.g. /workspace/results/motion-dumps. Empty disables it.
      AVATAR_DEBUG_DUMP_DIR: "${AVATAR_DEBUG_DUMP_DIR:-}"
      AVATAR_LIP_RETARGETING: "${AVATAR_LIP_RETARGETING:-false}"
      # Voice modes exposed in the browser:
      #   design           = reference-free voice design with CFG 4
      #   preset-clone     = fixed reference identity with CFG 1
      #   preset-direction = fixed identity plus this direction with CFG 4
      TTS_DEFAULT_VOICE_MODE: "${TTS_DEFAULT_VOICE_MODE:-preset-clone}"
      BREEZE_VOICE_INSTRUCTION: "A warm, clear, natural voice with a calm conversational delivery."
      BREEZE_DESIGN_CFG_SCALE: "4"
      BREEZE_PRESET_CLONE_CFG_SCALE: "1"
      BREEZE_PRESET_DIRECTION_CFG_SCALE: "4"
      BREEZE_PRESET_CLONE_INSTRUCTION: "Speak naturally in the reference voice."
      # A generated Breeze sentence or an owned/licensed WAV can be the preset.
      # Preset modes become selectable only when both the WAV and its exact
      # transcript file exist in ./inputs.
      BREEZE_PRESET_AUDIO_PATH: "${AVATAR_PRESET_AUDIO_PATH:-/workspace/inputs/voice-preset.wav}"
      BREEZE_PRESET_TRANSCRIPT_FILE: "${AVATAR_PRESET_TRANSCRIPT_FILE:-/workspace/inputs/voice-preset.txt}"
      # Optional alternative to the .txt file; leave empty to read the file.
      BREEZE_PRESET_TRANSCRIPT: ""
      # v2A initializes Breeze, HuBERT, JoyVASA and the renderer before the
      # browser can submit its first request. Failure is reported but nonfatal.
      STARTUP_WARMUP: "true"
      WARMUP_TEXT: "Hello."
      # Show an already-rendered, aligned warm-up frame while idle. The source
      # photo remains hidden, avoiding the large pose/crop jump at first speech.
      USE_NEURAL_IDLE_FRAME: "${AVATAR_USE_NEURAL_IDLE_FRAME:-true}"
      # Frame zero normally has the neutral initial JoyVASA pose. This can be
      # changed for diagnosis without rebuilding the image.
      WARMUP_IDLE_FRAME_INDEX: "${AVATAR_WARMUP_IDLE_FRAME_INDEX:-0}"
      # Protect manual or partial Compose starts: wait for the TTS provider instead of
      # failing warm-up immediately when port 7860 is not ready yet.
      TTS_STARTUP_WAIT_SECONDS: "300"
      TTS_STARTUP_POLL_SECONDS: "2"
      # Progressive phrase playback: generate phrase 1, start playback, then
      # generate later phrases while the current media queue is consumed.
      PROGRESSIVE_PHRASE_MODE: "true"
      PHRASE_FIRST_TARGET_CHARS: "${AVATAR_PHRASE_FIRST_TARGET_CHARS:-48}"
      MERGE_SHORT_OPENING_PHRASE: "${AVATAR_MERGE_SHORT_OPENING_PHRASE:-true}"
      PHRASE_MIN_FIRST_CHARS: "${AVATAR_PHRASE_MIN_FIRST_CHARS:-24}"
      PHRASE_TARGET_CHARS: "${AVATAR_PHRASE_TARGET_CHARS:-100}"
      PHRASE_MAX_CHARS: "${AVATAR_PHRASE_MAX_CHARS:-160}"
      # Render warping_spade with ONNX Runtime's TensorRT provider in FP16
      # (~27 ms vs ~97 ms per frame on the RTX 5080). The first start builds
      # engines into the cache below (~30 s); later starts reuse them.
      AVATAR_TENSORRT: "${AVATAR_TENSORRT:-true}"
      AVATAR_TENSORRT_CACHE: /workspace/trt-cache
      # Listening: the listener worker's socket. Empty disables listening.
      LISTENER_SOCKET: "${AVATAR_LISTENER_SOCKET:-/run/avatar/listener.sock}"
      # The conductor's socket. Empty disables conversation (typed text works).
      CONDUCTOR_SOCKET: "${AVATAR_CONDUCTOR_SOCKET:-/run/avatar/conductor.sock}"
      # HTTPS for microphone access from other machines, with a self-signed
      # certificate for this host's IP addresses (see entrypoint.sh).
      HTTPS_PORT: "${AVATAR_HTTPS_PORT:-8443}"
      HTTPS_CERT_DIR: /workspace/certs
      # For remote/NAT clients, set a TURN server JSON array here.
      ICE_SERVERS_JSON: "[]"
    volumes:
      - ./inputs:/workspace/inputs:ro
      - ./checkpoints:/workspace/FasterLivePortrait/checkpoints:ro
      - ./results:/workspace/results
      - ./models/trt-cache:/workspace/trt-cache
      - ./models/certs:/workspace/certs
      - avatar-run:/run/avatar
    depends_on:
      model-init:
        condition: service_completed_successfully
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: "no"

  # Invoked by benchmark.sh only. It uses the avatar image for httpx and WAV
  # tooling, writes the fixed Breeze-generated preset into ./inputs, and exits.
  benchmark-fixture:
    profiles: ["benchmark"]
    build: *avatar-build
    image: neural-avatar:latest
    network_mode: host
    command:
      - python
      - /workspace/FasterLivePortrait/benchmark_avatar.py
      - prepare-preset
    volumes:
      - ./inputs:/workspace/inputs
      - ./results:/workspace/results
    depends_on:
      tts:
        condition: service_healthy
    restart: "no"

volumes:
  # Unix sockets shared between the avatar and its worker processes.
  avatar-run:
