name: neural-avatar-test

x-avatar-build: &avatar-build
  context: .
  dockerfile: docker/Dockerfile
  target: avatar

x-model-volumes: &model-volumes
  - ./checkpoints:/workspace/FasterLivePortrait/checkpoints
  - ./models:/workspace/models

services:
  model-init:
    build: *avatar-build
    image: neural-avatar:latest
    command: ["download"]
    volumes: *model-volumes
    restart: "no"

  # Chatterbox TTS behind src/tts/chatterbox_api.py, in its own image because its
  # dependencies clash with the avatar's.
  tts:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: chatterbox
      args:
        - CHATTERBOX_VERSION
    image: neural-avatar-tts-chatterbox:latest
    command: ["chatterbox"]
    network_mode: host
    gpus: all
    shm_size: 4gb
    # Passed on from the shell or .env; the defaults are in the code (CONFIG.md).
    environment:
      - CHATTERBOX_VARIANT
      - CHATTERBOX_DEVICE
      - CHATTERBOX_LANGUAGE
      - CHATTERBOX_EXAGGERATION
      - CHATTERBOX_CFG_WEIGHT
      - CHATTERBOX_TURBO_REVISION
      - LOG_LEVEL
    volumes:
      - ./models:/workspace/models
      - ./models/chatterbox-cache:/root/.cache/huggingface
      - ./inputs:/workspace/inputs:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7860/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: "no"

  # Listening worker (M1): VAD + Nemotron 3.5 streaming ASR + Nemotron-3-
  # Diarization. Its own image because it needs a newer Transformers build than
  # the avatar image; the avatar reaches it through a Unix socket.
  listener:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: listener
    image: neural-avatar-listener:latest
    gpus: all
    # Passed on from the shell or .env; the defaults are in the code (CONFIG.md).
    # LISTENER_SAVE_AUDIO=true keeps each utterance's audio next to the
    # conversation log (opt-in).
    environment:
      - LISTENER_ASR_MODEL
      - LISTENER_DIAR_MODEL
      - LISTENER_ASR_LOOKAHEAD
      - LISTENER_ASR_LANGUAGE
      - LISTENER_DIAR_MODE
      - LISTENER_VAD_THRESHOLD
      - LISTENER_MIN_SILENCE_MS
      - LISTENER_PREROLL_MS
      - LISTENER_FLUSH_MS
      - LISTENER_SAVE_AUDIO
      - LOG_LEVEL
    volumes:
      - avatar-run:/run/avatar
      - ./models/hf-listener:/root/.cache/huggingface
      - ./results:/workspace/results
    restart: unless-stopped

  # Conductor (M2): turn-taking, replies and the local conversation log
  # (results/conversations/). Delete logs with src/conductor/forget.py (see its header).
  conductor:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: conductor
    image: neural-avatar-conductor:latest
    # System 2's small LLM runs in-process with llama.cpp on the GPU.
    gpus: all
    # Passed on from the shell or .env; the defaults are in the code (CONFIG.md).
    # Turn-taking: TURN_END_PUNCTUATION_MS / TURN_SILENCE_MS /
    # TURN_CONNECTIVE_MS of silence end the user's turn. System 1 (JevK5)
    # takes its classes and reactions from config/system1.json; System 2
    # answers from ./knowledge. CONDUCTOR_RESPONDER=echo is the M2 echo.
    environment:
      - TURN_END_PUNCTUATION_MS
      - TURN_SILENCE_MS
      - TURN_CONNECTIVE_MS
      - TURN_CONNECTIVES
      - LISTENER_MIN_SILENCE_MS
      - PTT_FINAL_WAIT_MS
      - CONDUCTOR_RESPONDER
      - SYSTEM1_MODEL
      - SYSTEM2_ENABLED
      - SYSTEM2_MODEL
      - SYSTEM2_MAX_TOKENS
      - KNOWLEDGE_EMBED_MODEL
      - REVIEW_MODEL
      - REVIEW_UNSURE_BELOW
      - REVIEW_REPEAT_SIMILARITY
      - LOG_LEVEL
    volumes:
      - ./knowledge:/workspace/knowledge:ro
      - avatar-run:/run/avatar
      - ./results:/workspace/results
      # Folder mount (not the file) so editors that replace the file still
      # reach the running conductor, which re-reads it on change.
      - ./config:/workspace/config:ro
      - ./models/hf-conductor:/root/.cache/huggingface
    restart: unless-stopped

  webrtc-avatar:
    build: *avatar-build
    image: neural-avatar:latest
    command: ["serve"]
    container_name: avatar_webrtc_studio
    network_mode: host
    gpus: all
    ipc: host
    shm_size: 8gb
    # The avatar's settings, defaults and profiles live in src/avatar/config.py
    # (described in CONFIG.md). Compose only passes on what the shell or .env
    # sets, under the same name; nothing here has a value of its own.
    environment:
      - AVATAR_PROFILE
      - AVATAR_RENDER_STRIDE
      - AVATAR_ADAPTIVE_RENDER_STRIDE
      - AVATAR_CATCHUP_RENDER_STRIDE
      - AVATAR_CATCHUP_BUFFER_SECONDS
      - AVATAR_INCREMENTAL_FRAME_WINDOWS
      - AVATAR_RENDER_WINDOW_FRAMES
      - AVATAR_SPEECH_START_GATE
      - AVATAR_SPEECH_START_SAFETY
      - AVATAR_EXPECTED_RENDER_FPS
      - AVATAR_TENSORRT
      - AVATAR_TTS_PREFETCH
      - AVATAR_TTS_PREFETCH_POLICY
      - AVATAR_TTS_PREFETCH_MIN_BUFFER_SECONDS
      - AVATAR_PHRASE_FIRST_TARGET_CHARS
      - AVATAR_PHRASE_MIN_FIRST_CHARS
      - AVATAR_PHRASE_TARGET_CHARS
      - AVATAR_PHRASE_MAX_CHARS
      - AVATAR_MERGE_SHORT_OPENING_PHRASE
      - AVATAR_DEFAULT_VOICE_MODE
      - AVATAR_EYE_MOTION_SCALE
      - AVATAR_HEAD_MOTION_SCALE
      - AVATAR_LIP_MOTION_MODE
      - AVATAR_LIP_MOTION_SCALE
      - AVATAR_LIP_SYNC_OFFSET_MS
      - AVATAR_AUDIO_KEEPALIVE_DBFS
      - AVATAR_DEBUG_DUMP_DIR
      - AVATAR_PERSISTENT_PHRASE_MOTION
      - AVATAR_RELATIVE_MOTION
      - AVATAR_ANIMATION_REGION
      - AVATAR_DRIVING_MULTIPLIER
      - AVATAR_NORMALIZE_LIP
      - AVATAR_EYE_RETARGETING
      - AVATAR_LIP_RETARGETING
      - AVATAR_CROP_ROTATION
      - AVATAR_USE_NEURAL_IDLE_FRAME
      - AVATAR_WARMUP_IDLE_FRAME_INDEX
      - AVATAR_IMAGE_PATH
      - AVATAR_PRESET_AUDIO_PATH
      - AVATAR_FACE_DETECTOR
      - AVATAR_FACE_LANDMARKER_PATH
      - AVATAR_FLP_CONFIG_PATH
      - AVATAR_RESULTS_ROOT
      - AVATAR_TENSORRT_CACHE
      - AVATAR_TTS_URL
      - AVATAR_LISTENER_SOCKET
      - AVATAR_CONDUCTOR_SOCKET
      - AVATAR_PORT
      - AVATAR_HTTPS_PORT
      - AVATAR_HTTPS_CERT_DIR
      - AVATAR_HTTPS_CERT_HOSTS
      - AVATAR_ICE_SERVERS_JSON
      - AVATAR_LOG_LEVEL
    volumes:
      - ./inputs:/workspace/inputs:ro
      - ./checkpoints:/workspace/FasterLivePortrait/checkpoints:ro
      - ./results:/workspace/results
      - ./models/trt-cache:/workspace/trt-cache
      - ./models/certs:/workspace/certs
      - ./tools:/workspace/tools:ro
      - avatar-run:/run/avatar
    depends_on:
      model-init:
        condition: service_completed_successfully
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: "no"

  # Invoked by benchmark.sh only. It uses the avatar image for httpx and WAV
  # tooling, writes the fixed generated preset into ./inputs, and exits.
  benchmark-fixture:
    profiles: ["benchmark"]
    build: *avatar-build
    image: neural-avatar:latest
    network_mode: host
    command:
      - python
      - /workspace/app/scripts/benchmark_avatar.py
      - prepare-preset
    volumes:
      - ./inputs:/workspace/inputs
      - ./results:/workspace/results
    depends_on:
      tts:
        condition: service_healthy
    restart: "no"

volumes:
  # Unix sockets shared between the avatar and its worker processes.
  avatar-run:
